name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP_FILE=$ZIP_FILE"
          test -n "$ZIP_FILE"

      - name: Unzip Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          rm -rf project
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Find project directory
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure AndroidX
        run: |
          cd "$PROJECT_DIR"

          touch gradle.properties

          if ! grep -q "^android.useAndroidX=" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          else
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          else
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties
          fi

          echo "===== gradle.properties ====="
          cat gradle.properties

      - name: Force Java 17 and Kotlin 17
        run: |
          cd "$PROJECT_DIR"

          APP_GRADLE=$(find . -type f -path "*/app/build.gradle.kts" -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            APP_GRADLE=$(find . -type f -path "*/app/build.gradle" -print -quit)
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app build.gradle not found"
            find . -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -print
            exit 1
          fi

          echo "Using: $APP_GRADLE"

          cp "$APP_GRADLE" "$APP_GRADLE.backup"

          echo "===== Original build file ====="
          cat "$APP_GRADLE"

          echo "===== Replacing old Java 8 settings ====="

          sed -i \
            -e 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' \
            -e 's/JavaVersion\.VERSION_8/JavaVersion.VERSION_17/g' \
            -e 's/JavaVersion\.VERSION_1_7/JavaVersion.VERSION_17/g' \
            -e 's/jvmTarget[[:space:]]*=[[:space:]]*"1\.8"/jvmTarget = "17"/g' \
            -e 's/jvmTarget[[:space:]]*=[[:space:]]*"8"/jvmTarget = "17"/g' \
            "$APP_GRADLE"

          echo "===== Adding forced Java 17 configuration ====="

          cat >> "$APP_GRADLE" <<'EOF'

          // ===== GitHub Actions: Force Java/Kotlin JVM 17 =====
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          // ===== End Java/Kotlin 17 configuration =====
          EOF

          echo "===== Final build file ====="
          cat "$APP_GRADLE"

      - name: Verify Java and Kotlin settings
        run: |
          cd "$PROJECT_DIR"

          echo "===== Checking Java ====="
          java -version

          echo "===== Checking Gradle ====="
          gradle --version

          echo "===== Checking project configuration ====="
          grep -R "VERSION_1_8\|VERSION_8\|jvmTarget.*1.8\|jvmTarget.*8" . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "===== BUILD START ====="

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "===== APK FILES ====="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: expiry-app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
